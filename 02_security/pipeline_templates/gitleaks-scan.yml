name: Gitleaks Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Gitleaks
      run: |
        wget https://github.com/zricethezav/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz
        tar -xvzf gitleaks_8.22.1_linux_x64.tar.gz
        sudo mv gitleaks /usr/local/bin/

    - name: Run Gitleaks
      run: |
        gitleaks detect -v