name: Deploy CV Agent to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación en Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: 'deployer-sa@reto-banorte.iam.gserviceaccount.com'

      - name: Desplegar en Cloud Run
        run: |
          gcloud run deploy banorte-cv-agent \
            --source ./03_microservice \
            --region us-central1 \
            --allow-unauthenticated