name: CD: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker
      uses: docker/setup-buildx-action@v1

    - name: Log in to Google Container Registry
      uses: google-github-actions/auth@v0
      with:
        credentials_json: ${{ secrets.GCR_PSW }}

    - name: Build and Push Docker Image
      run: |
        docker build --tag gcr.io/your-project/your-service .
        docker push gcr.io/your-project/your-service

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloud-run@v0
      with:
        service: your-service
        image: gcr.io/your-project/your-service
        region: us-central1
        platform_managed: true
